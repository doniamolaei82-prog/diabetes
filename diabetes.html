<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سنجش خطر دیابت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --title:#ffffff;--text:#e6ecff;--muted:#b4c2ee;
  --input:#ffffff;--input-text:#14224a;
  --btn1:#38bdf8;--btn2:#6366f1;--btn-shadow:#3730a3;--focus:#7dd3fc
}
body{
  font-family:"Vazirmatn",Tahoma,sans-serif;color:var(--text);min-height:100vh;padding:40px 16px 56px;overflow-x:hidden;
  background:
    radial-gradient(520px 420px at 12% 18%,rgba(255,92,162,.55),transparent 70%),
    radial-gradient(560px 460px at 88% 12%,rgba(255,176,59,.5),transparent 70%),
    radial-gradient(600px 480px at 85% 88%,rgba(45,212,191,.5),transparent 70%),
    radial-gradient(560px 460px at 10% 85%,rgba(139,92,246,.55),transparent 70%),
    linear-gradient(160deg,#16296b,#0b1440) fixed
}
.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;--mx:0;--my:0}
.item{
  position:absolute;width:calc(var(--s) * var(--k));height:calc(var(--s) * var(--k));perspective:600px;
  transform:translate3d(calc(var(--mx) * var(--d) * 1px),calc(var(--my) * var(--d) * 1px),0);
  transition:transform .25s ease-out
}
.float{width:100%;height:100%;animation:float var(--dur) ease-in-out var(--delay) infinite alternate;filter:drop-shadow(0 14px 12px rgba(0,0,0,.35))}
.float svg{width:100%;height:100%;display:block}
@keyframes float{
  from{transform:translateY(-12px) rotate(calc(var(--r) * -1deg))}
  to{transform:translateY(14px) rotate(calc(var(--r) * 1deg))}
}
.cube{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  animation:spin var(--spin) linear infinite;--h:calc(var(--s) * var(--k) / 2)
}
.cube i{
  position:absolute;inset:0;border-radius:8px;
  background:
    radial-gradient(circle at 20% 25%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 70% 60%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 40% 80%,#fff 0 1.5px,transparent 3px),
    linear-gradient(135deg,rgba(255,255,255,.95),rgba(205,225,255,.85));
  box-shadow:inset 0 0 14px rgba(120,160,255,.55);border:1px solid rgba(255,255,255,.8)
}
.cube i:nth-child(1){transform:translateZ(var(--h))}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(var(--h))}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(var(--h))}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(var(--h))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(var(--h))}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(var(--h))}
@keyframes spin{
  from{transform:rotateX(-20deg) rotateY(0deg)}
  to{transform:rotateX(340deg) rotateY(360deg)}
}
.stage{position:relative;z-index:2;perspective:1100px;max-width:520px;margin:0 auto}
.card{
  background:rgba(20,34,96,.66);border-radius:24px;padding:30px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 30px 50px -10px rgba(0,0,0,.5),0 12px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.2);
  transform-style:preserve-3d;transition:transform .15s ease-out
}
.welcome{background:rgba(0,0,0,.22);border-radius:16px;padding:14px 16px;margin-bottom:22px;text-align:center;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.3);transform:translateZ(20px)}
.welcome h2{font-size:1.15rem;margin-bottom:4px;color:var(--title)}
.welcome p{font-size:.85rem;line-height:1.8;color:var(--muted)}
h1{font-size:1.5rem;text-align:center;margin-bottom:4px;color:var(--title);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:22px}
.field{margin-bottom:16px;transform:translateZ(14px)}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px;color:var(--title)}
input,select{
  width:100%;padding:11px 14px;border:none;border-radius:12px;font:inherit;font-size:1rem;
  background:var(--input);color:var(--input-text);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.2),0 1px 0 rgba(255,255,255,.3);transition:box-shadow .2s
}
input:focus,select:focus{
  outline:none;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.2),0 0 0 4px color-mix(in srgb,var(--focus) 50%,transparent)
}
.btn{
  width:100%;padding:14px;margin-top:8px;border:none;border-radius:14px;cursor:pointer;
  font:inherit;font-size:1.15rem;font-weight:800;color:#fff;
  background:linear-gradient(180deg,var(--btn1),var(--btn2));
  box-shadow:0 7px 0 var(--btn-shadow),0 14px 22px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4);
  transform:translateZ(30px);transition:transform .12s,box-shadow .12s
}
.btn:hover{filter:brightness(1.07)}
.btn:active{
  transform:translateZ(30px) translateY(6px);
  box-shadow:0 1px 0 var(--btn-shadow),0 4px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.3)
}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.result{display:none;margin-top:24px;padding:18px;border-radius:16px;background:rgba(0,0,0,.24);
  box-shadow:inset 0 4px 10px rgba(0,0,0,.3)}
.result.show{display:block;animation:pop .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.status{font-size:1.3rem;font-weight:800;text-align:center}
.gauge{width:240px;max-width:100%;display:block;margin:6px auto 0}
.needle{transform-origin:120px 120px;transition:transform 1.1s cubic-bezier(.2,1.3,.4,1)}
.advice{text-align:center;font-weight:600;margin:4px 0 10px;color:var(--title)}
.detail{font-size:.9rem;color:var(--muted);background:rgba(0,0,0,.2);padding:10px 14px;border-radius:10px}
.note{margin-top:20px;font-size:.8rem;color:var(--muted);text-align:center}
@media(max-width:700px){.item{--k:.7}.card{padding:24px 20px}}
@media(min-width:701px){.item{--k:1}}
@media(prefers-reduced-motion:reduce){
  .float,.cube,.card,.needle,.result.show{animation:none;transition:none}
  .item{transition:none;transform:none}
}
</style>
</head>
<body>

<div class="scene" id="scene" aria-hidden="true">

      <svg viewBox="0 0 64 64"><path d="M32 4C32 4 8 32 8 44a24 24 0 0 0 48 0C56 32 32 4 32 4z" fill="url(#d1)"/><ellipse cx="22" cy="40" rx="5" ry="9" fill="#fff" opacity=".4" transform="rotate(20 22 40)"/></svg>

      <svg viewBox="0 0 64 64"><path d="M32 4C32 4 8 32 8 44a24 24 0 0 0 48 0C56 32 32 4 32 4z" fill="url(#d1)"/><ellipse cx="22" cy="40" rx="5" ry="9" fill="#fff" opacity=".4" transform="rotate(20 22 40)"/></svg>
    </div>
  </div>

  <div class="item" style="--s:72px;left:88%;top:76%;--d:36">

      <svg viewBox="0 0 96 64"><path d="M8 14l22 18L8 50z" fill="#ffb03b"/><path d="M88 14L66 32l22 18z" fill="#ffb03b"/>
      <ellipse cx="48" cy="32" rx="26" ry="22" fill="#ffd45e"/><path d="M34 14q-8 18 0 36M48 10q-6 22 0 44M62 14q8 18 0 36" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/></svg>
    </div>
  </div>

    <div class="float" style="--dur:6.6s;--delay:-1s;--r:12">
      <svg viewBox="0 0 80 80"><defs><radialGradient id="dn" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f9c98a"/><stop offset="1" stop-color="#c9772b"/></radialGradient></defs>
      <circle cx="40" cy="44" r="32" fill="url(#dn)"/>
      <path fill-rule="evenodd" d="M40 20a28 26 0 1 0 0 52a28 26 0 1 0 0-52zM40 36a9 8 0 1 1 0 16a9 8 0 1 1 0-16z" fill="#ff5ca2"/>

    <div class="float" style="--dur:5.2s;--delay:-2s;--r:6">
      <svg viewBox="0 0 64 88"><rect x="6" y="4" width="52" height="80" rx="12" fill="#1b2f6b"/><rect x="6" y="4" width="52" height="80" rx="12" fill="none" stroke="#7aa2ff" stroke-width="2"/>
      <rect x="14" y="14" width="36" height="26" rx="6" fill="#baf5d0"/><text x="32" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#145a32" font-family="Arial">5.6</text>
      <circle cx="32" cy="60" r="10" fill="#ff5c7a"/><circle cx="32" cy="60" r="4" fill="#ffd1d9"/></svg>

      <rect x="40" y="14" width="22" height="12" rx="3" fill="#cfe0ff"/><rect x="92" y="12" width="12" height="16" rx="3" fill="#6366f1"/><path d="M104 20h14" stroke="#cfd8ee" stroke-width="3" stroke-linecap="round"/>
      <rect x="68" y="8" width="8" height="24" fill="#ff5ca2"/></svg>

  <div class="item" style="--s:66px;left:30%;top:92%;--d:52">
    <div class="float" style="--dur:5s;--delay:-1s;--r:7">

      <path d="M40 22c-10-8-28-2-28 18 0 18 12 32 20 32 4 0 4-3 8-3s4 3 8 3c8 0 20-14 20-32 0-20-18-26-28-18z" fill="url(#ap)"/>
      <path d="M40 22q0-10 6-16" stroke="#6b4423" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M46 12q12-6 18 2q-10 6-18-2z" fill="#52c234"/>
      <ellipse cx="26" cy="40" rx="4" ry="9" fill="#fff" opacity=".4" transform="rotate(15 26 40)"/></svg>
    </div>
  </div>

</div>

<div class="stage">
  <div class="card" id="card">
    <div class="welcome">
      <h2>به سنجش خطر دیابت خوش آمدید</h2>
      <p>سه اطلاعات ساده را وارد کنید تا احتمال دیابت شما با مدلی که روی داده‌های واقعی ساخته شده برآورد شود.</p>
    </div>

    <h1>سنجش خطر دیابت</h1>
    <div class="sub">فقط سه سؤال</div>

    <form id="form">
      <div class="field">
        <label for="age">سن (سال)</label>
        <input type="number" id="age" min="21" max="81" value="45" required>
      </div>
      <div class="field">
        <label for="bmi">شاخص توده بدنی (BMI)</label>
        <input type="number" id="bmi" min="15" max="68" step="0.1" value="30" required>
      </div>
      <div class="field">
        <label for="glucose">گلوکز پلاسما (mg/dL)</label>
        <input type="number" id="glucose" min="40" max="300" value="120" required>
      </div>
      <button type="submit" class="btn">نمایش نتیجه</button>
    </form>

    <div class="result" id="result" aria-live="polite">
      <div class="status" id="status"></div>
      <svg class="gauge" viewBox="0 0 240 140" role="img" aria-label="گیج خطر">
        <defs>
          <linearGradient id="gg" x1="0" x2="1">
            <stop offset="0" stop-color="#27ae60"/>
            <stop offset=".45" stop-color="#f1c40f"/>
            <stop offset=".7" stop-color="#e67e22"/>
            <stop offset="1" stop-color="#c0392b"/>
          </linearGradient>
        </defs>
        <path d="M20 120A100 100 0 0 1 220 120" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="22" stroke-linecap="round"/>
        <path d="M20 120A100 100 0 0 1 220 120" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round"/>
        <g class="needle" id="needle" style="transform:rotate(-90deg)">
          <line x1="120" y1="120" x2="120" y2="40" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        </g>
        <circle cx="120" cy="120" r="9" fill="#ffffff"/>
      </svg>
      <div class="advice" id="advice"></div>
      <div class="detail" id="detail"></div>
    </div>

    <p class="note">مدل روی ۷۵۲ زن ۲۱ سال به بالا (داده Pima) ساخته شده است. این ابزار فقط برای آگاهی اولیه است و جایگزین آزمایش و تشخیص پزشک نیست.</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const card = $('card');
const scene = $('scene');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

if (!reduceMotion) {
  addEventListener('pointermove', e => {
    scene.style.setProperty('--mx', (e.clientX / innerWidth - .5) * 2);
    scene.style.setProperty('--my', (e.clientY / innerHeight - .5) * 2);
  });
  if (matchMedia('(hover:hover)').matches) {
    const stage = card.parentElement;
    stage.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5;
      const y = (e.clientY - r.top) / r.height - .5;
      card.style.transform = `rotateX(${(-y * 6).toFixed(2)}deg) rotateY(${(x * 8).toFixed(2)}deg)`;
    });
    stage.addEventListener('pointerleave', () => { card.style.transform = ''; });
  }
}

const MODEL = { intercept: -9.032377, glucose: 0.035548, bmi: 0.089753, age: 0.028699 };

const LEVELS = [
  { max: 25,  label: '🟢 خطر پایین',      color: '#2ecc71', advice: 'وضعیت نسبتاً خوب است؛ سبک زندگی سالم را ادامه دهید.' },
  { max: 50,  label: '🟡 خطر متوسط',      color: '#f1c40f', advice: 'بهتر است آزمایش قند ناشتا انجام دهید.' },
  { max: 75,  label: '🟠 خطر بالا',        color: '#e67e22', advice: 'توصیه می‌شود برای آزمایش قند خون به پزشک مراجعه کنید.' },
  { max: 101, label: '🔴 خطر بسیار بالا', color: '#ff6b5e', advice: 'هرچه زودتر برای بررسی قند خون به پزشک مراجعه کنید.' }
];

function calculate(age, bmi, glucose) {
  const z = MODEL.intercept + MODEL.glucose * glucose + MODEL.bmi * bmi + MODEL.age * age;
  const probability = 1 / (1 + Math.exp(-z));
  return Math.round(probability * 100);
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const age = parseFloat($('age').value) || 45;
  const bmi = parseFloat($('bmi').value) || 30;
  const glucose = parseFloat($('glucose').value) || 120;

  const percent = calculate(age, bmi, glucose);
  const level = LEVELS.find(l => percent < l.max);

  $('result').classList.add('show');
  $('status').textContent = `${level.label} (${percent}%)`;
  $('status').style.color = level.color;
  $('needle').style.transform = `rotate(${-90 + percent * 1.8}deg)`;
  $('advice').textContent = level.advice;
  $('detail').textContent = `احتمال برآوردشده دیابت با مدل رگرسیون لجستیک بر پایه سن، BMI و گلوکز`;
  $('result').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
});
</script>
</body>
</html>
